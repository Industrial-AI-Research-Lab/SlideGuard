[tool.poetry]
name = "slideguard"
version = "0.1.0"
description = "Library for students slide decks evaluation"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
duckduckgo-search = "^6.0.0"
#langchain-openai = "^0.1.0"
#langchain-community = "^0.2.0"
typer = "^0.16.0"
langfuse = "^3.2.4"
tqdm = "^4.66.0"
gradio = "^5.43.1"
PyMuPDF = "^1.23.0"
reportlab = "^4.4.3"
langchain-openai = "^0.3.33"
langgraph = "^0.6.8"
pypdfium2 = "^4.30.0"
bcrypt = "^5.0.0"

[tool.poetry.scripts]
slideguard = "slideguard.main:main"

[tool.poetry.group.dev.dependencies]
ipython = "^9.4.0"
jupyter = "^1.1.1"
langchain = "^0.3.27"
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"