[tool.poetry]
name = "slideguard"
version = "0.1.0"
description = "Library for students slide decks evaluation"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
crewai = "^0.150.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
duckduckgo-search = "^6.0.0"
langchain-openai = "^0.1.0"
langchain-community = "^0.2.0"
typer = "^0.16.0"
langfuse = "^3.2.4"
openinference-instrumentation-crewai = "^0.1.11"
openinference-instrumentation-litellm = "^0.1.24"

[tool.poetry.scripts]
slideguard = "slideguard.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"